<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-rail="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>APB 自学习参数体 · 控制台</title>
<link rel="icon" href="data:,">
<script>
/* 首屏前应用主题与侧栏状态：避免闪白/闪跳（读不到时回落到暗色） */
(function () {
  try {
    var t = localStorage.getItem('apb.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    if (localStorage.getItem('apb.rail') === '1') document.documentElement.setAttribute('data-rail', '1');
  } catch (e) { /* 隐私模式：忽略 */ }
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=__APB_VER__">
</head>
<body>

<!-- 图标精灵：内联 SVG symbol，无图标库、无外部请求 -->

    <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></g></symbol>
  <symbol id="i-signals" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19V9"/><path d="M9.3 19V4.5"/><path d="M14.7 19v-7"/><path d="M20 19v-4.5"/><path d="M2.5 19h19"/></g></symbol>
  <symbol id="i-model" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <path d="M7.4 7.9 16.3 11.1"/><path d="M7.4 16.1 16.3 12.9"/></g></symbol>
  <symbol id="i-market" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <path d="M7 20V15.6"/><rect x="5.2" y="10.4" width="3.6" height="4" rx="1.2"/>

    <path d="M17 20v-4.2"/><rect x="15.2" y="7.6" width="3.6" height="4" rx="1.2"/></g></symbol>
  <symbol id="i-ledger" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.4"/><path d="M7.5 8.5h9"/><path d="M7.5 12h9"/><path d="M7.5 15.5h5.5"/></g></symbol>
  <symbol id="i-paper" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5h13"/><path d="M13.5 5 17 8.5 13.5 12"/><path d="M20 15.5H7"/><path d="M10.5 12 7 15.5 10.5 19"/></g></symbol>
  <symbol id="i-behavior" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 13h3.2l2.1-6.4 3 12 2.6-8.6 1.8 3H21.5"/></g></symbol>
  <symbol id="i-events" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 9.6h17"/><path d="M8 3.5V6.5"/><path d="M16 3.5V6.5"/><path d="M7.6 13.4h3"/><path d="M7.6 17h7"/></g></symbol>
  <symbol id="i-risk" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2 4.8 6v5.6c0 4.3 3 7.6 7.2 9.2 4.2-1.6 7.2-4.9 7.2-9.2V6z"/><path d="M8.8 12.1l2.2 2.2 4.2-4.4"/></g></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

  <symbol id="i-menu" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">

  <symbol id="i-rail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="16" rx="2.2"/><path d="M9.5 4v16"/></g></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></g></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <path d="M4.5 12.5l4.7 4.7L19.5 7"/></g></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.6 21 19.4H3z"/><path d="M12 9.6v4.2"/><path d="M12 16.6v.1"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.6 15.6 20.5 20.5"/></g></symbol>
</svg>

<aside class="sidebar" id="sidebar">
  <div class="side-head">
    <span class="logo" aria-hidden="true">APB</span>
    <span class="side-name">自学习参数体</span>
    <button class="icon-btn rail-btn" id="btn-rail" type="button" title="折叠 / 展开侧栏" aria-label="折叠侧栏">
      <svg class="ico"><use href="#i-rail"></use></svg>
    </button>
  </div>
  <nav class="side-nav" id="side-nav" aria-label="主导航"></nav>
  <div class="side-foot">
    <span class="ver mono" id="side-version">v—</span>
    <button class="icon-btn" id="btn-theme" type="button" title="切换主题" aria-label="切换主题">
      <svg class="ico" id="theme-ico"><use href="#i-moon"></use></svg>
    </button>
  </div>
</aside>

<div class="scrim" id="scrim" hidden></div>

<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="btn-menu" type="button" title="菜单" aria-label="打开菜单">
      <svg class="ico"><use href="#i-menu"></use></svg>
    </button>
    <div class="topbar-title">
      <h1 id="page-title">总览</h1>
      <p id="page-sub">加载中…</p>
    </div>
    <div class="topbar-meta">
      <span class="chip" id="chip-asof" title="最新数据日">数据 —</span>
      <button class="ver-chip" id="chip-version" type="button" title="版本信息 / 检查更新">v—</button>
      <button class="update-badge" id="badge-update" type="button" hidden>
        <svg class="ico" aria-hidden="true"><use href="#i-download"></use></svg>
        <span id="badge-update-text">有新版本</span>
      </button>
      <span class="status-light" id="health-dot" title="连接状态"><i></i><b>—</b></span>
      <button class="btn ghost" id="btn-refresh" type="button">
        <svg class="ico"><use href="#i-refresh"></use></svg><span>刷新</span>
      </button>
    </div>
  </header>
  <main class="view" id="view" aria-live="polite"></main>
</div>

<nav class="bottom-nav" id="bottom-nav" aria-label="移动端导航"></nav>

<!-- 通用确认框（应用内更新 / 危险操作） -->
<div class="modal-mask" id="modal-mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="icon-btn" id="modal-close" type="button" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/app.js?v=__APB_VER__"></script>
</body>
</html>
