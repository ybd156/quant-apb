name: Release

# 打 tag 即发布：git tag v0.0.1 && git push origin v0.0.1
# 所有构建（Docker 镜像 + fnOS .fpk）都在 GitHub 上完成，本地不产出任何二进制。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.0.1）"
        required: true

permissions:
  contents: write     # 创建 Release
  packages: write     # 推 GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------- 1. 先跑测试，不过不发布 ----------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 单元测试（离线夹具，不依赖行情缓存）
        run: |
          python -m tests.test_signals
          python -m tests.test_metrics
          python -m tests.test_events
      - name: 无未来函数检验
        run: python tests/test_no_lookahead.py
      - name: 版本一致性
        run: |
          V=$(cat VERSION)
          PYV=$(python -c "import qcore;print(qcore.__version__)")
          echo "VERSION=$V qcore=$PYV"
          test "$V" = "$PYV" || { echo "VERSION 与 qcore.__version__ 不一致"; exit 1; }

  # ---------------- 2. 解析版本 ----------------
  meta:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

  # ---------------- 3. Docker 镜像（多架构）----------------
  docker:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=${{ needs.meta.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------- 4. 构建 fpk 并发布 ----------------
  release:
    needs: [meta, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成图标
        run: |
          pip install --quiet pillow
          python scripts/make_icons.py

      - name: 构建 fnOS fpk（x86 + arm）
        run: |
          chmod +x scripts/build-fpk.sh
          ./scripts/build-fpk.sh "${{ needs.meta.outputs.version }}" x86
          ./scripts/build-fpk.sh "${{ needs.meta.outputs.version }}" arm
          ls -la *.fpk

      - name: 构建训练机套件
        run: |
          chmod +x scripts/build-train-kit.sh
          ./scripts/build-train-kit.sh "${{ needs.meta.outputs.version }}"
          ls -la apb-train-kit_*.zip

      - name: 准备附件
        run: |
          mkdir -p dist
          mv *.fpk dist/
          mv apb-train-kit_*.zip dist/
          cp docker-compose.yml dist/
          cp deploy/fnos/README.md dist/FNOS-INSTALL.md
          cat > dist/INSTALL.md <<'EOF'
          # APB 安装

          ## 方式一：fnOS .fpk（飞牛用户推荐）
          在 fnOS「应用中心 → 手动安装」选择 `apb_<version>_x86.fpk`
          （ARM 设备选 `_arm`）。安装后自动拉取镜像并启动，端口 8765。

          ## 方式二：Docker Compose
          mkdir -p /vol1/docker/apb && cd /vol1/docker/apb
          # 放入本包的 docker-compose.yml，然后
          docker compose up -d

          ## 方式三：直接跑镜像
          docker run -d --name apb --restart unless-stopped -p 8765:8765 -v ./data:/app/data -e TZ=Asia/Shanghai ghcr.io/ybd156/quant-apb:latest

          ## 首次初始化
          docker exec -it apb python -m qcore.pipeline --pool 300 --start 2013-01-01

          打开 http://<NAS-IP>:8765

          > 研究工具，输出为统计检验结果，不构成投资建议。
          EOF
          ls -la dist

      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ needs.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "APB $TAG" --notes-file dist/INSTALL.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
