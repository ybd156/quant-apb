name: Release

# 打 tag 即发布：git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.0.1）"
        required: true

permissions:
  contents: write     # 创建 Release
  packages: write     # 推 GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------- 1. 先跑测试，不过不发布 ----------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 单元测试
        run: |
          python -m tests.test_signals
          python -m tests.test_metrics
          python -m tests.test_events
      - name: 无未来函数检验
        run: python tests/test_no_lookahead.py
      - name: 版本一致性
        run: |
          V=$(cat VERSION)
          PYV=$(python -c "import qcore;print(qcore.__version__)")
          echo "VERSION=$V qcore=$PYV tag=${{ github.ref_name }}"
          test "$V" = "$PYV" || { echo "VERSION 与 qcore.__version__ 不一致"; exit 1; }

  # ---------------- 2. 多架构构建并推 GHCR ----------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: QEMU（支持 arm64，很多 NAS 是 ARM）
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打包发布附件
        run: |
          mkdir -p dist
          cp docker-compose.yml dist/
          cp deploy/fnos/*.md dist/ 2>/dev/null || true
          cat > dist/INSTALL.md <<EOF
          # APB v${{ steps.ver.outputs.version }} 安装

          ## 方式一：Docker Compose（推荐，飞牛 fnOS 用这个）
          \`\`\`bash
          mkdir -p /vol1/docker/apb && cd /vol1/docker/apb
          # 把本包的 docker-compose.yml 放进来
          docker compose up -d
          \`\`\`
          打开 http://<NAS-IP>:8765

          ## 方式二：直接跑镜像
          \`\`\`bash
          docker run -d --name apb --restart unless-stopped \\
            -p 8765:8765 -v ./data:/app/data \\
            -e TZ=Asia/Shanghai \\
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          \`\`\`

          镜像同时提供 amd64 与 arm64。
          EOF
          zip -r dist/apb-${{ steps.ver.outputs.version }}.zip docker-compose.yml deploy VERSION README.md
          ls -la dist

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，上传附件"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "APB $TAG" \
              --generate-notes \
              --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
              --notes "
          ## 安装

          \`\`\`bash
          docker run -d --name apb --restart unless-stopped \\
            -p 8765:8765 -v ./data:/app/data -e TZ=Asia/Shanghai \\
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          \`\`\`

          支持 **amd64 / arm64**（NAS 常见两种架构都覆盖）。

          > 本项目是研究工具，输出为统计检验结果，不构成投资建议。
          "
          fi
