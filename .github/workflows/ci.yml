name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 每个测试单独一步：打包在一个 run 里失败时，日志只显示「exit 1」，
      # 看不出是哪一个挂的（实测排查全靠猜）。拆开后失败步骤名就是测试名。
      - name: 单元测试 · signals
        run: python -m tests.test_signals
      - name: 单元测试 · metrics
        run: python -m tests.test_metrics
      - name: 单元测试 · events
        run: python -m tests.test_events
      - name: 单元测试 · info
        run: python -m tests.test_info
      - name: 单元测试 · us_data
        run: python -m tests.test_us_data
      - name: 单元测试 · intraday
        run: python -m tests.test_intraday

      - name: 接线层回归（台账幂等 / 朝向 / DSR 单位）
        run: |
          python -m tests.test_store_ledger
          python -m tests.test_dsr_units

      - name: 检查器负控（注入违规必须 FAIL）
        run: python -m tests.test_invariants_negative

      - name: 更新检查分页（否则最新版本永远停在第一页）
        run: python -m tests.test_update_check

      - name: 版本号唯一真源（防止 webui/VERSION 复活）
        run: python -m tests.test_version_sources

      - name: 时间门禁（交易日/时段/成交价所属日）
        run: python -m tests.test_time_gates

      - name: 任务队列超时与重领
        run: python -m tests.test_sync_tasks

      - name: 访问令牌（多令牌/哈希存储/单独吊销）
        run: python -m tests.test_tokens

      - name: 训练机守护（版本跟随 / 崩溃重拉 / 启动器编码）
        run: python -m tests.test_agent_daemon

      - name: 配置向导（令牌探测 / 保留其它字段 / 脚本编码）
        run: python -m tests.test_kit_setup

      - name: 可观测性（训练进度 / 数据新鲜度 / 一屏状态 / 单一入口）
        run: python -m tests.test_observability

      # 必须跑导入层（不要 --no-import）：AST 看不见 importlib/字符串 import
      # 这类动态依赖，只有真 import 一遍才能证明「训练机接得住所有任务」。
      - name: 训练机套件闭包完整性（文件层 + 导入层）
        run: python -m scripts.kit_manifest --verify .

      - name: 入口脚本语法（python -c 块里的反引号会被 sh 当命令替换）
        run: |
          sh -n docker/start.sh
          grep -n '`' docker/start.sh && { echo "start.sh 里不许有反引号"; exit 1; } || true

      - name: 增量=批量 parity（无本地行情时自动 SKIP）
        run: python -m tests.test_incremental_parity

      - name: Alpha158 因子自检（截断不变性 / 未来扰动 / 朴素对拍）
        run: python -m qcore.alpha158

      # APB_OFFLINE=1：INV-1 检验必须确定性。允许联网重取会让
      # 全量跑与截断跑拿到不同数据，报出假前视（实测 2.37e-02）。
      - name: 无未来函数检验（核心不变量）
        env:
          APB_OFFLINE: "1"
        run: python tests/test_no_lookahead.py

      # 不加 `|| true`：HIGH>0 时脚本返回 1，必须让 CI 红。
      # （MEDIUM 属评估层统计，需人工签收；用 --strict 才会阻塞。）
      - name: 泄漏静态扫描
        run: python audit/leak_scan.py

      - name: 不变量自检
        run: python -m qcore.invariants

      # 到期判断必须有人结算：有 overdue 且无自动口径 → 非零退出，CI 变红。
      # 这是「7 条判断长期 0 结算」的机制化修复（不靠人记得）。
      - name: 判断台账到期结算
        run: python -m qcore.claims settle

      # 豁免清单必须与当前代码一致：代码变了而清单没刷新 → 红，
      # 防止「704 条 MEDIUM 里 608 条从没人看过」那种积压悄悄复发。
      - name: 泄漏豁免清单新鲜度
        run: python -m audit.gen_waivers --check

      # 三个探针依赖**实时外部行情**（东财），结果随网络与限流变化 ——
      # 这类诊断不能当门禁：同一份代码可能今天红明天绿，红灯就失去信息量。
      # 与 leak_scan 的区别：那个是纯静态扫源码，输入确定 → 可以阻塞。
      # 探针跑出来只是「参考」，结论要人工看（产物写 data/state/basis*.json）。
      - name: 探针 · 复权口径与生存者偏差（诊断，不阻塞）
        continue-on-error: true
        run: |
          python -m audit.basis_probe --codes 40 || echo "::warning::basis_probe 未能完成（多为外部行情不可达）"
          python -m audit.basis_ic --codes 60   || echo "::warning::basis_ic 未能完成"
          python -m audit.pool_probe --codes 300 || echo "::warning::pool_probe 报出可疑项（见日志）"

      # 发布闸门（评审 R42）：scripts/preflight.py 553 行、文档要求"每次改完必须跑"，
      # 但 CI/Release 都没接。这里跑 --quick（跳过引擎重跑与测试套件，起服务打全部 GET）。
      - name: 发布闸门（preflight --quick）
        run: python scripts/preflight.py --quick

      - name: 导入自检
        run: python -c "import qcore, qcore.pipeline, qcore.live, qcore.brief, webui.server; print('import ok', qcore.__version__)"
