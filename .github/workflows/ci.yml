name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 单元测试
        run: |
          python -m tests.test_signals
          python -m tests.test_metrics
          python -m tests.test_events

      - name: 无未来函数检验（核心不变量）
        run: python tests/test_no_lookahead.py

      - name: 泄漏静态扫描
        run: python audit/leak_scan.py || true

      - name: 导入自检
        run: python -c "import qcore, qcore.pipeline, qcore.live, qcore.brief, webui.server; print('import ok', qcore.__version__)"
